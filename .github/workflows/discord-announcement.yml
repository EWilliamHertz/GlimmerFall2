name: Discord Update Notification

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Get commit message
        id: commit
        run: |
          MSG=$(jq -r '.head_commit.message' "$GITHUB_EVENT_PATH")
          echo "commit_msg<<EOF" >> $GITHUB_ENV
          echo "$MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Send to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          python -c '
          import urllib.request
          import json
          import os

          url = "https://discord.com/api/v10/channels/1532031799952146555/messages"
          headers = {
              "Authorization": f"Bot {os.environ.get('DISCORD_BOT_TOKEN')}",
              "Content-Type": "application/json",
              "User-Agent": "DiscordBot (https://github.com/EWilliamHertz/GlimmerFall2, 1.0.0)"
          }

          msg = os.environ.get("commit_msg", "New updates pushed to GlimmerFall!")
          content = f"**New GlimmerFall Update Deployed!** 🚀\n\n```\n{msg}\n```"

          data = json.dumps({"content": content}).encode("utf-8")
          req = urllib.request.Request(url, data=data, headers=headers, method="POST")

          try:
              with urllib.request.urlopen(req) as response:
                  print("Success:", response.read().decode())
          except Exception as e:
              print("Error:", e)
          '
